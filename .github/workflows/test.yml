name: Flood Finder checks
on:
  push:
    branches: [main, flood-finder-v2-weather-addresses]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm test
      - run: docker build -t flood-finder:check .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint==1.58.0
      - run: python deploy/aws/generate-stack.py && git diff --exit-code deploy/aws/stack.json
      - run: cfn-lint deploy/aws/stack.json
      - run: bash -n deploy/aws/launch.sh
      - run: python deploy/aws/test_launch.py
