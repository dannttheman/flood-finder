services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the immutable ECR image URI}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      TRUST_PROXY: '1'
      DATABASE_PATH: /app/data/flood-finder.sqlite
      NWS_USER_AGENT: ${NWS_USER_AGENT:?Set a real public project contact}
    volumes:
      - /srv/flood-finder/data:/app/data
    expose: ['3000']
    mem_limit: 768m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  edge:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/flood-finder/caddy-data:/data
      - /srv/flood-finder/caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
